services:
  db:
    image: postgres:16-alpine
    container_name: windiq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-windiq}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-windiq}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  redis:
    image: redis:7.2.4-alpine
    container_name: windiq-redis
    hostname: windiq-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-windiq_redis_dev_secret_pass}"
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6385}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-windiq_redis_dev_secret_pass}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windiq-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      APP_NAME: ${APP_NAME:-WindIQ API}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/windiq}
      REDIS_URL: ${REDIS_URL:-redis://:windiq_redis_dev_secret_pass@windiq-redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-windiq_redis_dev_secret_pass}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-["127.0.0.1/32","::1/128","172.16.0.0/12","10.0.0.0/8"]}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}
      TIMEZONE: ${TIMEZONE:-Europe/London}
      DECISION_CUTOFF_HOUR: ${DECISION_CUTOFF_HOUR:-9}
      DECISION_CUTOFF_MINUTE: ${DECISION_CUTOFF_MINUTE:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=3).getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: windiq-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s

volumes:
  postgres_data:
    driver: local
